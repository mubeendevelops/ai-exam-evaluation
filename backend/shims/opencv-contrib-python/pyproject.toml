[project]
name = "opencv-contrib-python"
version = "4.10.0.84"
description = "Tarn shim: satisfies PaddleX's opencv-contrib-python==4.10.0.84 requirement with the project's pinned opencv-python-headless (one cv2 module, no GUI libraries). Ships no OpenCV code."
requires-python = ">=3.12,<3.13"
dependencies = ["opencv-python-headless==4.14.0.94"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tarn_opencv_contrib_shim"
