[project]
name = "tarn-api"
version = "0.0.0"
description = "Tarn AI Evaluation HTTP API (FastAPI adapter over the core)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "tarn-core",
    "tarn-adapters",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"
