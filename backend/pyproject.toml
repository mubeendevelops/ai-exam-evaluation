[project]
name = "tarn-workspace"
version = "0.0.0"
description = "Tarn AI Evaluation backend workspace (uv)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tarn-core",
    "tarn-adapters",
    "tarn-api",
    "tarn-worker",
    "tarn-cli",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-jsonschema==4.26.0.20260518",
]
# The local OCR engines (P10): torch (CUDA build), transformers, Paddle, pytesseract. A default
# group, so `make setup` and the Docker image get them; CI skips them (`--no-group ocr`).
ocr = ["tarn-adapters[ocr]"]
# The cloud OCR SDKs (Textract, Azure Read): off by default, install with `--group cloud-ocr`.
cloud-ocr = ["tarn-adapters[cloud-ocr]"]

[tool.uv]
package = false
default-groups = ["dev", "ocr"]

[tool.uv.workspace]
members = ["core", "adapters", "api", "worker", "cli"]

[tool.uv.sources]
tarn-core = { workspace = true }
tarn-adapters = { workspace = true }
tarn-api = { workspace = true }
tarn-worker = { workspace = true }
tarn-cli = { workspace = true }

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["core/tests", "adapters/tests", "api/tests", "worker/tests", "cli/tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration and not models'"
markers = [
    "integration: needs the Docker Compose stack (make up); run with `make test-integration`",
    "models: runs the real OCR engines (the `ocr` group and downloaded weights: `tarn ocr models fetch`); run with `make test-models`",
]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core/src", "adapters/src", "api/src", "worker/src", "cli/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF", "S", "T20"]

# Maths and OCR text use these on purpose (the selector formula, minus and times signs in
# numeric answers, the typographic apostrophe in handwriting).
allowed-confusables = ["α", "β", "−", "×", "’"]

[tool.ruff.lint.per-file-ignores]
# The seed data is prose (keys, rubrics, K-EL text): long string lines are the content.
"core/src/tarn_core/seed/data/**" = ["E501"]
"**/tests/**" = ["S101", "S105", "S106"]
# The queue contract is test code that lives in the package so adapters can reuse it.
"core/src/tarn_core/testing/queue_contract.py" = ["S101"]
# The P21 journey and tenancy sweep: tests that run on both the in-memory and PostgreSQL stacks.
"api/src/tarn_api/journey.py" = ["S101"]
"api/src/tarn_api/tenancy_sweep.py" = ["S101"]
# Migrations build DDL from constants (table names, policy expressions), never from input.
"**/migrations/**" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["tarn_core", "tarn_adapters", "tarn_api", "tarn_worker", "tarn_cli"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["core/src", "adapters/src", "api/src", "worker/src", "cli/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
files = [
    "core/src", "core/tests",
    "adapters/src", "adapters/tests",
    "api/src", "api/tests",
    "worker/src", "worker/tests",
    "cli/src", "cli/tests",
]

# PyMuPDF ships no type information for its document API.
[[tool.mypy.overrides]]
module = ["tarn_adapters.imaging.pdf", "tarn_adapters.sheets.pdf"]
disallow_untyped_calls = false

# The OCR libraries (P10) are optional (the `ocr` and `cloud-ocr` groups) and untyped or huge:
# they are used through narrow adapters, typed as Any, and never analysed (CI has none of them).
[[tool.mypy.overrides]]
module = [
    "torch", "torch.*", "transformers", "transformers.*", "paddle", "paddle.*",
    "paddleocr", "paddleocr.*", "paddlex", "paddlex.*", "pytesseract", "pytesseract.*",
    "sentence_transformers", "sentence_transformers.*",
    "boto3", "boto3.*", "botocore", "botocore.*", "azure.ai.*", "azure.core.*",
    "google.cloud.storage", "google.cloud.storage.*",
    "google.cloud.documentai", "google.cloud.documentai.*",
    "google.cloud.documentai_v1", "google.cloud.documentai_v1.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# --- import-linter: the architecture rules of CLAUDE.md / design.md ----------
[tool.importlinter]
root_packages = ["tarn_core", "tarn_adapters", "tarn_api", "tarn_worker", "tarn_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "tarn_core is pure: no web, database, cloud, ML or adapter imports"
type = "forbidden"
source_modules = ["tarn_core"]
forbidden_modules = [
    # web
    "fastapi", "starlette", "uvicorn", "pydantic", "pydantic_settings", "typer",
    # database and queue
    "sqlalchemy", "psycopg", "psycopg2", "alembic", "procrastinate",
    # HTTP clients
    "requests", "httpx", "httpx2", "httpcore", "urllib3", "aiohttp",
    # cloud and object storage
    "boto3", "botocore", "minio", "azure", "google",
    # ML and imaging
    "torch", "transformers", "sentence_transformers", "paddle", "paddleocr",
    "cv2", "numpy", "sklearn", "scipy", "pytesseract", "fitz",
    # our own outer layers
    "tarn_adapters", "tarn_api", "tarn_worker", "tarn_cli",
]

[[tool.importlinter.contracts]]
name = "Layers: api, worker and cli sit on adapters, which sit on core"
type = "layers"
layers = [
    "tarn_api | tarn_worker | tarn_cli",
    "tarn_adapters",
    "tarn_core",
]
