[project]
name = "tarn-cli"
version = "0.0.0"
description = "Tarn AI Evaluation command-line interface."
requires-python = ">=3.12,<3.13"
dependencies = [
    "tarn-core",
    "tarn-adapters",
    "typer==0.27.2",
]

[project.scripts]
tarn = "tarn_cli.main:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"
