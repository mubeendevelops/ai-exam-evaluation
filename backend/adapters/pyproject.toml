[project]
name = "tarn-adapters"
version = "0.0.0"
description = "Tarn AI Evaluation adapters: PostgreSQL, object storage, OCR engines, embedder, queue."
requires-python = ">=3.12,<3.13"
dependencies = [
    "tarn-core",
    "minio==7.2.20",
    "alembic==1.20.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.3",
    "structlog==26.1.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "google-cloud-kms==3.18.0",
    "google-cloud-secret-manager==2.31.0",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"
