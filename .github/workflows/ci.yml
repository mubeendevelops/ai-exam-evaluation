# CI — lint + `make test-fast`, always (push and PR alike), never `make test`.
#
# Why test-fast and not full `make test`, on every trigger rather than
# splitting PR/main:
#   * `make test` needs paddleocr/paddlepaddle/sentence-transformers
#     installed (the two heaviest, most fragile pins in requirements.txt —
#     see that file's own version-fight history) AND downloads the
#     all-MiniLM-L6-v2 model from Hugging Face the first time a `slow` test
#     runs it — real network access, which is exactly what this suite is
#     supposed to not need (no GROQ_API_KEY, no MinIO).
#   * Every non-`slow` test — 400 of 412 as of this workflow, the entire
#     API/auth/RLS/tenant-isolation surface among them — needs none of that:
#     core/ imports paddleocr/sentence-transformers lazily (first call, not
#     module load), so `-m "not slow"` never even imports them.
#   * The 12 deselected tests characterize real embedding-model behaviour
#     (cosine-similarity quality), which is a "does this look right before a
#     release" check, not a per-PR gate — run `make test` locally
#     (`.venv-paddleocr` already carries the heavy stack) before a release,
#     not here.
# There is therefore no lighter/heavier split worth making between PR and
# main: every trigger runs the same, fast, network-free job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # E9 (syntax errors) + F (pyflakes: undefined names, unused imports,
      # etc.) only — a real-bugs ruleset, not a style opinion, chosen so this
      # doesn't turn into a second thing to argue with on every PR. No repo
      # config exists yet (no pyproject.toml/ruff.toml); add one instead of
      # widening the `--select` here if the project wants more from lint.
      - run: pip install ruff
      - run: ruff check --select E9,F .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_evaluation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: ai_evaluation
      # The application role (migration 016) — tests run through it like the
      # real app does, so RLS is actually exercised (CLAUDE_CONTEXT.md §6).
      # Owner credentials are separate and only used to apply/seed the schema.
      PGUSER: ai_eval_app
      PGPASSWORD: ci_app_password
      APP_DB_USER: ai_eval_app
      APP_DB_PASSWORD: ci_app_password
      PGADMIN_USER: postgres
      PGADMIN_PASSWORD: postgres
      API_ENV: development
      STORAGE_MODE: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # postgresql-client ships on GitHub's ubuntu-latest image already, but
      # is installed explicitly here rather than assumed — scripts/migrate.py
      # shells out to `psql` (migrations 016/017 use psql meta-commands that
      # psycopg2 cannot interpret at all; see that script's module docstring).
      - name: Ensure psql is available
        run: psql --version || sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install test dependencies (heavy ML stack deliberately excluded)
        run: |
          # paddleocr/paddlepaddle/sentence-transformers are lazily imported
          # (see this file's header) and skipped entirely here — installing
          # them would cost real time and disk for zero test coverage gained
          # under -m "not slow".
          grep -vE '^paddleocr|^paddlepaddle|^sentence-transformers|^#|^$' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          # core/booklet_ingest.py imports cv2 at MODULE load (not lazily) —
          # api/main.py's router wiring pulls it in just to construct the
          # app, so it's needed even under -m "not slow". Normally arrives
          # transitively via paddleocr, which isn't installed here.
          pip install opencv-python-headless

      - name: Apply migrations
        run: python scripts/migrate.py --up

      - name: Seed minimal fixtures
        # Direct psql, not scripts/reset_and_seed_db.sh: that script also
        # pg_dumps a backup first, which risks a client/server version
        # mismatch against whatever postgresql-client GitHub's runner image
        # carries — pointless ceremony for a service container that's
        # destroyed with the job anyway. The script itself is exercised by
        # this repo's own local/compose workflows, not by CI.
        run: psql -h "$PGHOST" -p "$PGPORT" -U "$PGADMIN_USER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f migrations/seed_minimal.sql
        env:
          PGPASSWORD: ${{ env.PGADMIN_PASSWORD }}

      - name: make test-fast
        run: make test-fast
