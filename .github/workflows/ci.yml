name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
      # Real student booklets (samples/), local data (var/) and secrets (.env) are git-ignored;
      # this fails the build if any of them was ever added by force (P21).
      - name: No student data or secrets in the repository
        run: test -z "$(git ls-files samples var .env)"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The OCR libraries (torch, Paddle: several GB) are left out; their tests are marked
      # `models` and run locally (make test-models). UV_NO_SYNC keeps `uv run` from adding them.
      - run: cd backend && uv sync --frozen --no-group ocr
      - run: cd backend && uv run ruff check .
      - run: cd backend && uv run ruff format --check .
      - run: cd backend && uv run lint-imports
      - run: cd backend && uv run mypy
      - run: cd backend && uv run python -m tarn_api.openapi --check
      - run: cd backend && uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run format:check
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run api:check
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e
