# Development stack. Data stays on this machine: PostgreSQL and MinIO use named volumes and
# publish ports on 127.0.0.1 only. No cloud storage or cloud OCR in development.
# Variables come from .env (copy .env.example; `make setup` does it).
name: tarn

# One image for api, worker and storage-init; it is built once, by the api service.
x-backend: &backend
  image: tarn/backend:dev
  volumes:
    - ./backend:/app/backend
    # Development KMS file key and encrypted identity backups (git-ignored var/).
    - ./var/keys:/app/var/keys
    - ./var/backups:/app/var/backups
  environment: &backend-env
    TARN_ENV: development
    TARN_LOG_LEVEL: ${TARN_LOG_LEVEL:-INFO}
    TARN_DATABASE_URL: postgresql://${POSTGRES_USER:-tarn}:${POSTGRES_PASSWORD:-tarn_dev_password}@postgres:5432/${POSTGRES_DB:-tarn}
    TARN_APP_DATABASE_URL: postgresql://tarn_app:${TARN_APP_DB_PASSWORD:-tarn_app_dev_password}@postgres:5432/${POSTGRES_DB:-tarn}
    TARN_BLOB_ENDPOINT: minio:9000
    TARN_BLOB_ACCESS_KEY: ${MINIO_ROOT_USER:-tarn_dev_minio}
    TARN_BLOB_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tarn_dev_minio_password}
    TARN_BLOB_SECURE: "false"
    TARN_BLOB_BUCKET: ${TARN_BLOB_BUCKET:-tarn}
    TARN_DEVICE: ${TARN_DEVICE:-auto}
    # The worker serves GET /health inside the Compose network (not published); the API reads it.
    TARN_WORKER_HEALTH_HOST: 0.0.0.0
    TARN_WORKER_HEALTH_URL: http://worker:8001/health
    TARN_CLOUD_OCR_ENABLED: ${TARN_CLOUD_OCR_ENABLED:-false}
    # Identity store (P4): its own database and role.
    TARN_IDENTITY_DATABASE_URL: postgresql://${POSTGRES_USER:-tarn}:${POSTGRES_PASSWORD:-tarn_dev_password}@postgres:5432/${TARN_IDENTITY_DB:-tarn_identity}
    TARN_IDENTITY_APP_DATABASE_URL: postgresql://tarn_auth:${TARN_AUTH_DB_PASSWORD:-tarn_auth_dev_password}@postgres:5432/${TARN_IDENTITY_DB:-tarn_identity}
    TARN_KMS_KEY_REF: ${TARN_KMS_KEY_REF:-local:tarn-dev}
    TARN_LOCAL_KEY_DIR: /app/var/keys
    TARN_PASSWORD_PEPPER: ${TARN_PASSWORD_PEPPER:-dev-only-pepper-not-for-production}
    TARN_TOKEN_SIGNING_KEY: ${TARN_TOKEN_SIGNING_KEY:-dev-only-signing-key-not-for-production}
    TARN_PUBLIC_URL: ${TARN_PUBLIC_URL:-http://localhost:5173}
    TARN_TENANT_SIGNUP_REQUIRES_APPROVAL: ${TARN_TENANT_SIGNUP_REQUIRES_APPROVAL:-true}
    TARN_IDENTITY_BACKUP_DIR: /app/var/backups/identity
    TARN_IDENTITY_BACKUP_INTERVAL_HOURS: ${TARN_IDENTITY_BACKUP_INTERVAL_HOURS:-24}
    # Upload, page cleaning, job queue (P9); the defaults are in tarn_adapters/config.py.
    TARN_MAX_QUEUED_BOOKLETS_PER_TEACHER: ${TARN_MAX_QUEUED_BOOKLETS_PER_TEACHER:-5}
    TARN_UPLOAD_MAX_BYTES: ${TARN_UPLOAD_MAX_BYTES:-104857600}
    TARN_UPLOAD_MAX_PAGES: ${TARN_UPLOAD_MAX_PAGES:-40}
    TARN_PAGE_MAX_EDGE_PX: ${TARN_PAGE_MAX_EDGE_PX:-2200}
    TARN_PAGE_MAX_BYTES: ${TARN_PAGE_MAX_BYTES:-800000}
    TARN_QUALITY_MIN_SHARPNESS: ${TARN_QUALITY_MIN_SHARPNESS:-130}
    TARN_QUALITY_MAX_GLARE_SHARE: ${TARN_QUALITY_MAX_GLARE_SHARE:-0.06}
    TARN_QUALITY_MIN_PAGE_EDGE_PX: ${TARN_QUALITY_MIN_PAGE_EDGE_PX:-500}
    TARN_JOB_MAX_ATTEMPTS: ${TARN_JOB_MAX_ATTEMPTS:-3}
    TARN_JOB_LEASE_SECONDS: ${TARN_JOB_LEASE_SECONDS:-120}
    TARN_JOB_BACKOFF_SECONDS: ${TARN_JOB_BACKOFF_SECONDS:-5}
    TARN_WORKER_POLL_SECONDS: ${TARN_WORKER_POLL_SECONDS:-2}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarn_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tarn}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    build: ./deploy/dev/minio
    image: tarn/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tarn_dev_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tarn_dev_minio_password}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: creates the bucket, then exits.
  storage-init:
    <<: *backend
    command: ["tarn", "storage-init"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    build: ./backend
    command:
      - uvicorn
      - tarn_api.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "tarn_worker"]
    environment:
      <<: *backend-env
      # OCR model weights (P10): the host's git-ignored var/models (TrOCR under huggingface/,
      # Paddle under paddlex/), shared with `uv run tarn ocr …` on the host, so the weights
      # exist once and not on the Docker disk. Filled by `tarn ocr models fetch`.
      TARN_MODEL_DIR: /models
      # The LLM scorer (P19), off by default. Only the worker calls the provider, so only the
      # worker gets the keys. Development needs both flags and a college switched on with
      # `tarn tenants llm`; the answer text of that college then goes to the provider.
      TARN_LLM_SCORER_ENABLED: ${TARN_LLM_SCORER_ENABLED:-false}
      TARN_LLM_ALLOW_IN_DEVELOPMENT: ${TARN_LLM_ALLOW_IN_DEVELOPMENT:-false}
      TARN_GROQ_MODEL: ${TARN_GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
    volumes:
      - ./backend:/app/backend
      - ./var/keys:/app/var/keys
      - ./var/backups:/app/var/backups
      - ./var/models:/models
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: node:24.21.0-bookworm-slim
    working_dir: /app/frontend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
