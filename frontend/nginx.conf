# The web app is static files; the load balancer sends /api/* to the API service, so nothing
# here proxies. Unknown paths fall back to index.html (client-side routes: /qna, /evaluate, ...).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Hashed build assets never change: cache them for a year. The page itself is never cached.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
