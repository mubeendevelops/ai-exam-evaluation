server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # All backend routes live under /api/v1 (plus /health) — see api/main.py's
    # include_router() calls. Proxying them here keeps the frontend calling
    # relative paths (src/api/client.ts's baseUrl defaults to "") so it works
    # same-origin behind a single tunnel URL, with no CORS setup needed.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # react-router-dom uses client-side routing, so any path that isn't a
    # real static file falls back to index.html and lets the router handle it.
    location / {
        try_files $uri /index.html;
    }
}
