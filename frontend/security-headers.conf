# Included in every location of nginx.conf: nginx drops the server-level add_header lines in a
# location that has its own add_header, so the headers are listed here once and included (P21).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Everything is self-hosted (fonts, icons). Page images are fetched with the token and shown
# as blob: URLs. React's style attributes need 'unsafe-inline' for styles (not for scripts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# The load balancer terminates TLS; browsers keep to https for a year.
add_header Strict-Transport-Security "max-age=31536000" always;
