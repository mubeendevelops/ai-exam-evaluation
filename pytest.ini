[pytest]
testpaths = tests
pythonpath = .
markers =
    db: touches the live Postgres DB
    slow: loads the all-MiniLM-L6-v2 sentence-transformer

# API tests (tests/test_api/) are async — httpx.AsyncClient over the ASGI app.
# strict mode (the default): only tests explicitly marked `asyncio` are run
# through the event loop, so the existing sync suite is untouched.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
